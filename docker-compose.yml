services:
  check-cx:
    image: bingzi233/check-cx:latest
    container_name: check-cx
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    # docker 内部日志用 local driver + 轮转，防止无限增长
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
